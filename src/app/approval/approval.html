<div class="row">
    <div class="col-12">
        <div class="common-wrapper">
            <!-- Page Heading -->
            <div class="page-title mb-3">
                <h4>Approval</h4>
            </div>
            <!-- Approval Details Card -->
            <div class="inward-card">
                <div class="col-md-3">
                    <label class="form-label custom-label">Approval Type</label>
                    <select class="form-select" [(ngModel)]="selectedAction" (change)="onActionChange($event)">
                        <option value="" selected disabled>Select Approval Type</option>
                        <option value="cashier-entry">Approve Cashier Entry</option>
                        <option value="sahara-cashier-entry">Approve Sahara Cashier Entry</option>
                        <option value="loan-repayment">Approve Loan Repayment</option>
                        <option value="edit-cashier-entry">Approve Edit Cashier Entry</option>
                        <option value="pa-cashier-entry">Approve PA Cashier Entry</option>
                        <option value="cancel-cashier-entry">Cancel Cashier Entry</option>
                        <option value="micr-code">MICR Code</option>
                        <option value="eft-approve-cashier">EFT Approve Cashier</option>
                        <option value="rpp-cashier">RPP Cashier Approve</option>
                    </select>
                </div>
            </div>
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
