<div class="row">
    <div class="col-12">
        <div class="common-wrapper">
            <div class="page-title mb-3">
                <h4>Bulk Upload</h4>
            </div>

            <div class="inward-card">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label custom-label">Select Bulk Upload</label>
                            <select class="form-select custom-select" (change)="onCategoryChange($event)">
                                <option value="" disabled selected>Select</option>
                                <option value="individual">Individual</option>
                                <option value="group">Group</option>

                            </select>
                        </div>
                        @if (subOptions.length > 0) {
                        <div class="col-md-3">
                            <label class="form-label custom-label">Type</label>

                            <select class="form-select custom-select" (change)="onSubCategoryChange($event)">

                                <option value="">Select</option>

                                @for (item of subOptions; track item) {
                                <option [value]="item.value">
                                    {{ item.label }}
                                </option>
                                }

                            </select>
                        </div>
                        }

                    </div>

                </div>

            </div>

            <router-outlet></router-outlet>
        </div>
    </div>
</div>
