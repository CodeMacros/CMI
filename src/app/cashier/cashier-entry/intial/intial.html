<div class="row mt-2">
    <div class="col-12">
        <div class="common-wrapper">
            <!-- <div class="page-title mb-3">
                <h4> Inward</h4>
            </div> -->

            <!-- Courier Details Card -->
            <div class="inward-card">

                <div class="common-card-header pb-0">
                    <h5 class="section-title">Cashier Entry</h5>
                </div>
                <app-dynamic-form [form]="cashierEntryForm" [fields]="cashierEntryFields"></app-dynamic-form>
            </div>





            <!-- accordion -->
            <div class="custom-accordion mt-3">


                <!-- Proposal Details -->
                <div class="accordion-item">
                    <div class="accordion-header" (click)="toggleAccordion('proposal')">
                        <div>
                            <h5>Proposal Details</h5>
                            <!-- <p>Provide proposal and customer related information</p> -->
                        </div>
                        <i class="fa-solid" [class.fa-chevron-down]="openedSection !== 'proposal'"
                            [class.fa-chevron-up]="openedSection === 'proposal'">
                        </i>
                    </div>

                    <div class="accordion-body" [hidden]="openedSection !== 'proposal'">
                        <div class="pt-2">
                            <app-dynamic-form [form]="proposalDetailsForm"
                                [fields]="proposalDetailsFields"></app-dynamic-form>
                        </div>


                    </div>
                </div>

                <!-- Channel Details -->
                <div class="accordion-item">
                    <div class="accordion-header" (click)="toggleAccordion('channel')">
                        <div>
                            <h5>Channel Details</h5>
                            <!-- <p>Provide proposal and customer related information</p> -->
                        </div>
                        <i class="fa-solid" [class.fa-chevron-down]="openedSection !== 'channel'"
                            [class.fa-chevron-up]="openedSection === 'channel'">
                        </i>
                    </div>

                    <div class="accordion-body" [hidden]="openedSection !== 'channel'">
                        <div class="pt-2">
                            <!-- <app-dynamic-form [form]="channelDetailsForm" [fields]="channelDetailsFields"></app-dynamic-form> -->
                        </div>


                    </div>
                </div>


                <!-- Payment Details -->
                <div class="accordion-item">
                    <div class="accordion-header" (click)="toggleAccordion('document')">
                        <div>
                            <h5>Instrument Details</h5>
                            <!-- <p>Provide proposal and customer related information</p> -->
                        </div>
                        <i class="fa-solid" [class.fa-chevron-down]="openedSection !== 'document'"
                            [class.fa-chevron-up]="openedSection === 'document'">
                        </i>
                    </div>

                    <div class="accordion-body" [hidden]="openedSection !== 'document'">
                        <div class="pt-2">
                           <app-dynamictable [columns]="tableColumns"></app-dynamictable>
                        </div>


                    </div>
                </div>


                <!-- Button -->
                <div class="btn-group mt-3">
                    <button class="btn-submit">
                        Preview
                    </button>
                    <button (click)="onSubmit()" class="btn-submit">
                        Submit
                    </button>

                    <button (click)="clear()" class="btn-clear">
                        Clear
                    </button>

                </div>

            </div>

        </div>
    </div>
</div>
