<div class="row mt-2">
    <div class="col-12">
        <div class="common-wrapper">
            <div class="inward-card">

                <div class="common-card-header pb-0">
                    <h5 class="section-title">Add Collection Bank</h5>
                </div>
                <app-dynamic-form [form]=" addCollectionBankForm" (fieldChanged)="onSelectChange($event)"
                    [fields]=" addCollectionBankfields"></app-dynamic-form>
            </div>

        </div>
    </div>
</div>

<div class="row mt-4">
    <div class="col-12">
        <div class="d-flex justify-content-center gap-3">

            <div>
                <button class="btn-submit" (click)="addCollectionBank()">
                    Submit
                </button>
            </div>

            <!-- <button class="btn-clear" (click)="clear()">
                    Clear
                </button> -->

        </div>
    </div>
</div>
