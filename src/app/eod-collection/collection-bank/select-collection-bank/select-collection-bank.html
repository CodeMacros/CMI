
<div class="row">
    <div class="col-12">
        <div class="common-wrapper">
            <div class="inward-card">

                <div class="common-card-header pb-0">
                    <h5 class="section-title">Collection Bank</h5>
                </div>
                <app-dynamic-form [form]="collectionBankForm" (fieldChanged)="onSelectChange($event)"  [fields]="collectionBankfields"></app-dynamic-form>
            </div>

        </div>
    </div>
</div>

    <div class="col-12">
        <div class="d-flex justify-content-center gap-3">

            <div>
                <button class="btn-submit" (click)="collectionBank()">
                    Submit
                </button>
            </div>

                <!-- <button class="btn-clear" (click)="clear()">
                    Clear
                </button> -->

        </div>
    </div>
</div>
