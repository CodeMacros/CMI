<div class="row mt-2">
    <div class="col-12">
        <div class="common-wrapper">
            <div class="inward-card">

                <div class="common-card-header pb-0">
                    <h5 class="section-title">None-Lodegment</h5>
                </div>
                <app-dynamic-form [form]="markUnmarkForm" (fieldChanged)="onSelectChange($event)"
                    [fields]="markUnmarkfields"></app-dynamic-form>

                <app-dynamic-form [form]="markUnmarkFilterForm" (fieldChanged)="onSelectChange($event)"
                    [fields]="markUnmarkFilterfields"></app-dynamic-form>


                <app-dynamic-form [form]="markUnmarkSearchForm" (fieldChanged)="onSelectChange($event)"
                    [fields]="markUnmarkSearchfields"></app-dynamic-form>
            </div>

        </div>
    </div>
</div>

<div class="row mt-4">
    <div class="col-12">
        <div class="d-flex justify-content-center gap-3">

            <div>
                <button class="btn-submit" (click)="markUnmark()">
                    Submit
                </button>
            </div>

            <button class="btn-clear" (click)="clear()">
                Reset
            </button>

        </div>
    </div>
</div>
