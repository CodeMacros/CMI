<div class="row">
    <div class="col-12">
        <div class="common-wrapper">
            <!-- Page Heading -->
            <div class="page-title mb-3">
                <h4>Fund Transfer</h4>
            </div>
            <!-- Approval Details Card -->
            <div class="inward-card">
                <div class="col-md-3">
                    <label class="form-label custom-label">Fund Transfer Type</label>
                    <select class="form-select" [(ngModel)]="selectedType" (change)="onActionChange()">
                        <option value="" selected disabled>Select Fund Transfer Type</option>
                        <option value="entry">Fund Transfer Entry</option>
                        <option value="approval">Fund Transfer Approval</option>
                    </select>
                </div>
            </div>
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
