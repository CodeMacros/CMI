<div class="row">
    <div class="col-12">
        <div class="common-wrapper">

            <!-- Page Heading -->
            <div class="page-title mb-3">
                <h4>Miscellaneous Inward</h4>
            </div>

            <!-- Courier Details Card -->
            <div class="inward-card">

                <div class="common-card-header pb-0">
                    <h5 class="section-title">Inward Details</h5>
                </div>
                <app-dynamic-form [form]="inwardDocumnetForm" [fields]="inwardDocumentField"
                    (fieldChanged)="onFieldChanged($event)"></app-dynamic-form>
            </div>
            <!-- accordion -->
            <div class="custom-accordion mt-3">

                <!-- Proposal Details -->
                <div class="accordion-item">
                    <div class="accordion-header" (click)="toggleAccordion('courier')">
                        <div>
                            <h5>Courier Details</h5>
                            <!-- <p>Provide proposal and customer related information</p> -->
                        </div>
                        <i class="fa-solid" [class.fa-chevron-down]="openedSection !== 'courier'"
                            [class.fa-chevron-up]="openedSection === 'courier'">
                        </i>
                    </div>

                    <div class="accordion-body" [hidden]="openedSection !== 'courier'">
                        <!-- Your Proposal Form Here -->
                        <div class="pt-2">
                            <!-- <app-dynamic-form [form]="documnetForm" [fields]="documentField"></app-dynamic-form> -->
                            <app-dynamic-form [form]="courierForm" [fields]="courierfields"
                                (fieldChanged)="onFieldChanged($event)"></app-dynamic-form>
                        </div>


                    </div>
                </div>



                <!-- Document Details -->

                @if(!isRenewal){
                <div class="accordion-item">
                    <div class="accordion-header" (click)="toggleAccordion('document')">
                        <div>
                            <h5>Document Details</h5>
                            <!-- <p>Provide proposal and customer related information</p> -->
                        </div>
                        <i class="fa-solid" [class.fa-chevron-down]="openedSection !== 'document'"
                            [class.fa-chevron-up]="openedSection === 'document'">
                        </i>
                    </div>

                    <div class="accordion-body" [hidden]="openedSection !== 'document'">
                        <!-- Your Proposal Form Here -->
                        <div class="pt-2">
                            <app-dynamic-form [form]="documnetForm" [fields]="documentField"></app-dynamic-form>
                        </div>


                    </div>
                </div>
                }


                <!-- Button -->
                <div class="btn-group mt-3">

                    <!-- <button (click)="onSubmit()" class="btn-submit" data-bs-toggle="modal"
                        data-bs-target="#myInfoModal">
                        Submit
                    </button> -->
                    <button (click)="onSubmit()" class="btn-submit">
                        Submit
                    </button>

                    <button class="btn-clear" (click)="clear()">
                        Clear
                    </button>

                </div>

            </div>

        </div>
    </div>
</div>
