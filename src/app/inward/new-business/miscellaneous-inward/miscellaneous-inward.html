<div class="row">
    <div class="col-12">
        <div class="common-wrapper">

            <!-- Page Heading -->
            <div class="page-title mb-3">
                <h4>Miscellaneous Inward</h4>
            </div>

            <!-- Courier Details Card -->
            <div class="inward-card">

                <div class="common-card-header pb-0">
                    <h5 class="section-title">Courier Details</h5>
                </div>
                <app-dynamic-form [form]="courierForm" [fields]="courierfields"></app-dynamic-form>
            </div>
            <!-- accordion -->
            <div class="custom-accordion mt-3">
                <!-- Proposal Details -->
                <div class="accordion-item">
                    <div class="accordion-header" (click)="toggleAccordion('proposal')">
                        <div>
                            <h5>Documnet Details</h5>
                            <!-- <p>Provide proposal and customer related information</p> -->
                        </div>
                        <i class="fa-solid" [class.fa-chevron-down]="openedSection !== 'proposal'"
                            [class.fa-chevron-up]="openedSection === 'proposal'">
                        </i>
                    </div>

                    <div class="accordion-body" [hidden]="openedSection !== 'proposal'">
                        <!-- Your Proposal Form Here -->
                        <div class="pt-2">
                            <app-dynamic-form [form]="documnetForm" [fields]="documentForm"></app-dynamic-form>
                        </div>


                    </div>
                </div>


                <!-- Button -->
                <div class="btn-group mt-3">

                    <!-- <button (click)="onSubmit()" class="btn-submit" data-bs-toggle="modal"
                        data-bs-target="#myInfoModal">
                        Submit
                    </button> -->
                    <button (click)="onSubmit()" class="btn-submit">
                        Submit
                    </button>

                    <button class="btn-clear">
                        Clear
                    </button>

                </div>

            </div>

        </div>
    </div>
</div>
