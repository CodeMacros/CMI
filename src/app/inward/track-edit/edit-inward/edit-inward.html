<div class="row">

                <h4>Edit Inward</h4>
            </div> -->
            <div class="inward-card">

                <div class="common-card-header pb-0">
                    <h5 class="section-title">Edit Details</h5>

                <app-dynamic-form [form]="editForm" (fieldChanged)="onSelectChange($event)"
                    [fields]="editInwardfields"></app-dynamic-form>

        </div>

<div class="row mt-4">
    <div class="col-12">
        <div class="d-flex justify-content-center gap-3">

            <div>
                <button class="btn-submit" (click)="editInward()">
                    Edit Inward
                </button>
            </div>

            <button class="btn-clear" (click)="clear()">
                Clear
            </button>

        </div>
    </div>
</div>
