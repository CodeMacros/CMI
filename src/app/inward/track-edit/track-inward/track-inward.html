<div class="row mt-2">
    <div class="col-12">
        <div class="common-wrapper">
            <div class="inward-card">

                <div class="common-card-header pb-0">
                    <h5 class="section-title">Track Details</h5>
                </div>
                <app-dynamic-form [form]="trackInwardForm" (fieldChanged)="onSelectChange($event)"  [fields]="trackInwardfields"></app-dynamic-form>
            </div>

        </div>
    </div>
</div>


<div class="row mt-4">
    <div class="col-12">
        <div class="d-flex justify-content-center gap-3">

            <div>
                <button class="btn-submit" (click)="trackInward()">
                    Track Inward
                </button>
            </div>

            <button class="btn-clear" (click)="clear()">
                Clear
            </button>

        </div>
    </div>
</div>
