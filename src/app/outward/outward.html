<div class="row">
    <div class="col-12">
        <div class="common-wrapper">
            <div class="page-title mb-3">
                <h4>Outward</h4>
            </div>
            <div class="inward-card">
                <div class="row">
                    <div class="col-md-3">
                        <select class="form-select" (change)="onActionChange($event)">
                            <option value="" selected disabled>Select Outward Type</option>
                            <option value="outward">Outward</option>
                            <option value="auto">Auto Outward</option>
                            <option value="track">Track Outward</option>
                            <option value="edit">Edit Outward</option>
                            <option value="correct-awb">Correct AWB Number</option>
                        </select>
                    </div>
                    @if(autoDiv){
                    <div class="col-md-3">
                        <select class="form-select" (change)="onAutoTypeChange($event)">
                            <option value="" selected disabled>Select Auto Outward Category</option>
                            <option value="initial">Initial</option>
                            <option value="renewal">Renewal</option>
                            <option value="group">Group</option>
                            <option value="pslbPayouts">PS and LB Payouts</option>
                        </select>
                    </div>
                    }
                </div>
            </div>
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
